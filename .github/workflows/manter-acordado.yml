name: Manter o back acordado

on:
  schedule:
    - cron: "*/10 11-23 * * *"
    - cron: "*/10 0-1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar a API
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            --max-time 120 --retry 2 --retry-delay 10 \
            https://agro-back-nndj.onrender.com/
